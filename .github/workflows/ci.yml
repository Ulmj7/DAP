name: ci

# Feature 001 (AI Security Foundation), Milestone M1: enforces only what the M1 scope requires (lint, types, dependency boundaries,
# PostgreSQL migrations, the security, conformance and integration suites, the reference-host vertical path, and the single M1 gate).
# Feature 002 (semantic walkthrough runtime, UI P0) adds three steps before the M1 gate: its focused suite, its two closure proofs and the web build.
# None of them needs PostgreSQL, a browser download, a model provider or the network beyond `npm ci`.
# Optional and future checks (mutation, determinism, coverage report, container build, scanners) are deliberately not here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Code, build and PostgreSQL tests
    # A manual dispatch must also select main; no other branch runs this job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_COMPOSE_PROJECT: dap-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Development-only credentials for this job's ephemeral localhost database.
      DAP_DATABASE_URL: postgresql://dap_app:dap_app_local_only@127.0.0.1:54329/dap
      DAP_MIGRATE_DATABASE_URL: postgresql://dap_owner:dap_owner_local_only@127.0.0.1:54329/dap
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/ci-results"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Build backend
        run: npm run build:host
      - name: Start isolated PostgreSQL
        run: docker compose -p "$CI_COMPOSE_PROJECT" -f deploy/compose.yaml up -d --wait --wait-timeout 90 postgres
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Architecture tests
        run: npm run test:arch
      - name: All existing test suites
        run: npm test -- --reporter=default --reporter=junit --outputFile="$RUNNER_TEMP/ci-results/tests.xml"
      - name: Collect database diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ci-results"
          docker compose -p "$CI_COMPOSE_PROJECT" -f deploy/compose.yaml ps -a > "$RUNNER_TEMP/ci-results/database-status.txt" 2>&1 || true
          docker compose -p "$CI_COMPOSE_PROJECT" -f deploy/compose.yaml logs --no-color postgres > "$RUNNER_TEMP/ci-results/database.log" 2>&1 || true
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -p "$CI_COMPOSE_PROJECT" -f deploy/compose.yaml down --volumes --remove-orphans
      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/
          if-no-files-found: warn
          retention-days: 7
