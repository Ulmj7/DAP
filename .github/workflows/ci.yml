name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Development-only credentials for this job's ephemeral localhost database.
      DAP_DATABASE_URL: postgresql://dap_app:dap_app_local_only@127.0.0.1:54329/dap
      DAP_MIGRATE_DATABASE_URL: postgresql://dap_owner:dap_owner_local_only@127.0.0.1:54329/dap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: docker compose -f deploy/compose.yaml up -d --wait postgres
      - run: npm run db:migrate
      - run: npm run test:arch
      - run: npm test
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes
