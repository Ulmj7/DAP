# Local development only. Password defaults below are not deployment credentials.
# After startup, export DAP_MIGRATE_DATABASE_URL (dap_owner) and DAP_DATABASE_URL
# (dap_app) using these passwords, host 127.0.0.1, port 54329, database dap.
name: dap-foundation

services:
  migrate:
    image: ai-tuslah:lab08
    pull_policy: never
    command: ["node", "db/migrate.mjs"]
    environment:
      DAP_MIGRATE_DATABASE_URL: ${DAP_DOCKER_MIGRATE_DATABASE_URL:-postgresql://dap_owner:dap_owner_local_only@postgres:5432/dap}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ai-tuslah:lab08
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: development
      DAP_ALLOW_DEV_AUTH: "1"
      PORT: "3000"
      DAP_DATABASE_URL: ${DAP_DOCKER_DATABASE_URL:-postgresql://dap_app:dap_app_local_only@postgres:5432/dap}
      DEV_SESSIONS: ${DEV_SESSIONS:-[]}
      DAP_GLOBAL_ALLOWLIST: ${DAP_GLOBAL_ALLOWLIST:-[]}
    ports:
      - "127.0.0.1:${DAP_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz', {signal: AbortSignal.timeout(2000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dap
      POSTGRES_USER: dap_bootstrap
      POSTGRES_PASSWORD: ${DAP_POSTGRES_PASSWORD:-dap_bootstrap_local_only}
      DAP_OWNER_PASSWORD: ${DAP_OWNER_PASSWORD:-dap_owner_local_only}
      DAP_APP_PASSWORD: ${DAP_APP_PASSWORD:-dap_app_local_only}
    ports:
      - "127.0.0.1:${DAP_POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../db/migrations/000_roles.sql:/docker-entrypoint-initdb.d/000_roles.sql:ro
    configs:
      - source: postgres-passwords
        target: /docker-entrypoint-initdb.d/001_passwords.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

configs:
  postgres-passwords:
    content: |
      #!/bin/sh
      set -eu
      psql --set=ON_ERROR_STOP=1 --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB" \
        --set=owner_password="$$DAP_OWNER_PASSWORD" --set=app_password="$$DAP_APP_PASSWORD" \
        --set=database_name="$$POSTGRES_DB" <<'SQL'
      ALTER ROLE dap_owner PASSWORD :'owner_password';
      ALTER ROLE dap_app PASSWORD :'app_password';
      ALTER DATABASE :"database_name" OWNER TO dap_owner;
      SQL

volumes:
  postgres-data:
